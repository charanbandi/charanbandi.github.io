<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Charan Bandi</title>
  <meta http-equiv="refresh" content="3;url=https://charanbandi.github.io" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c14;
      color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      padding: 24px;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(45,212,191,0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent);
      pointer-events: none;
    }

    .card {
      position: relative;
      text-align: center;
      max-width: 480px;
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 48px 40px;
    }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 80px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #2dd4bf, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .bar-wrap {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2dd4bf, #3b82f6);
      border-radius: 9999px;
      animation: fill 3s linear forwards;
    }
    @keyframes fill { to { width: 100%; } }

    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      font-family: 'JetBrains Mono', monospace;
    }

    a.home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 10px;
      background: rgba(45,212,191,0.08);
      border: 1px solid rgba(45,212,191,0.2);
      color: #2dd4bf;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
      margin-bottom: 24px;
    }
    a.home:hover {
      background: rgba(45,212,191,0.14);
      border-color: rgba(45,212,191,0.35);
    }
  </style>
  <script>
    // Redirect to home after 3 seconds
    setTimeout(() => { window.location.href = 'https://charanbandi.github.io'; }, 3000);
  </script>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist — but the portfolio does.<br>Redirecting you there now.</p>
    <a class="home" href="https://charanbandi.github.io">← Go to portfolio</a>
    <div class="bar-wrap"><div class="bar"></div></div>
    <p class="hint">Redirecting in 3 seconds…</p>
  </div>
</body>
</html>
